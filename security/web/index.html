<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Second Look · Secure access</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f766e'/%3E%3Ccircle cx='13' cy='16' r='6.5' fill='none' stroke='white' stroke-width='2.2'/%3E%3Ccircle cx='19.5' cy='16' r='6.5' fill='none' stroke='white' stroke-width='2.2' opacity='.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="lock.css" data-second-look-css>
</head>
<body class="app-body">
  <div id="app" class="app sl-app-hidden" data-second-look-app>
    <header class="app-header">
      <div class="app-brand">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><circle cx="13" cy="16" r="6.5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="19.5" cy="16" r="6.5" fill="none" stroke="#fff" stroke-width="2.2" opacity=".6"/></svg>
        <span>Second Look</span>
      </div>
      <div class="app-session">
        <span class="app-who">Logged in as <strong id="who-name">…</strong><span class="app-chip" id="who-role"></span></span>
        <span class="app-idle" id="idle" aria-live="off">Auto-lock in –:––</span>
        <button class="app-btn" id="btn-lock" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          Lock
        </button>
        <button class="app-btn" id="btn-logout" type="button">Log out</button>
      </div>
    </header>

    <main class="app-main">
      <section class="app-card" aria-labelledby="patient-h">
        <div class="app-card-head">
          <div>
            <h2 id="patient-h">Patient</h2>
            <p class="app-sub">Demo host page for the lock module</p>
          </div>
        </div>
        <div class="app-placeholder" id="patient-area">
          <div>
            <strong>Patient screen goes here</strong>
            Your app renders here. It is blurred and made inert whenever the session is locked.
          </div>
        </div>
        <div class="app-actions">
          <button class="app-btn app-btn-accent" id="btn-open" type="button">Simulate opening patient 0000-0001</button>
          <button class="app-btn" id="btn-ping" type="button">Call protected /api/ping</button>
        </div>
        <p class="app-result" id="result" role="status"></p>
      </section>

      <section class="app-card" aria-labelledby="audit-h">
        <div class="app-card-head">
          <div>
            <h2 id="audit-h">Audit trail</h2>
            <p class="app-sub">Latest events · <span class="app-badge" id="chain">–</span></p>
          </div>
          <button class="app-btn" id="btn-audit" type="button">Refresh</button>
        </div>
        <ul class="app-audit-list" id="audit" aria-live="polite"></ul>
      </section>
    </main>
  </div>

  <script src="second-look-lock.js"></script>
  <script src="lock.js"></script>
</body>
</html>
